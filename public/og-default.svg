<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#14130E"/>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Logo: badminton court + shuttlecock (Facility Presence mark) -->
  <g transform="translate(485 120) scale(2.3)">
    <rect x="10" y="20" width="80" height="60" rx="4" fill="#312E81"/>
    <line x1="50" y1="20" x2="50" y2="80" stroke="#6366F1" stroke-width="2"/>
    <line x1="10" y1="50" x2="90" y2="50" stroke="#6366F1" stroke-width="2"/>
    <circle cx="50" cy="35" r="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
    <path d="M50 47 L44 65" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round"/>
    <path d="M50 47 L50 65" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round"/>
    <path d="M50 47 L56 65" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="600" y="470" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF">Facility Presence</text>
  <text x="600" y="525" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="400" fill="#A5B4FC">One platform to run your courts</text>
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#14130E"/>
    </radialGradient>
  </defs>
</svg>
